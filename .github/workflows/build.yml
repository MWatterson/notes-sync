name: build-sub
on:
  push:
    paths: ["servers.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate base64 subscription
        run: grep -vE '^\s*(#|$)' servers.txt | base64 -w0 > sub
      - name: Commit
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add sub
          git diff --staged --quiet || git commit -m "rebuild sub"
          git push
