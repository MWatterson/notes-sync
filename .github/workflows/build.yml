name: build-sub
on:
  push:
    paths: ["servers.txt", "users.txt", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Normalise server list
        run: |
          set -euo pipefail
          tr -d '\r' < servers.txt | grep -vE '^[[:space:]]*(#|$)' > servers.clean
          echo "servers: $(wc -l < servers.clean)"

      - name: Build shared subscription
        run: |
          set -euo pipefail
          base64 -w0 servers.clean > sub
          cp sub A-Link

      - name: Build per-user subscriptions
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          # The label is watermarked invisibly: each byte becomes 8 zero-width
          # characters appended to every server name (U+200B = 0, U+200C = 1),
          # percent-encoded since the name lives in the URI fragment. Renders as
          # nothing in every client, but survives copying a config out of one.
          tr -d '\r' < users.txt | grep -vE '^[[:space:]]*(#|$)' | while read -r token label rest; do
            [ -n "$token" ] || continue
            mark=$(printf '%s' "$label" | xxd -b -c1 | awk '{print $2}' | tr -d '\n' \
                   | sed -e 's/0/%E2%80%8B/g' -e 's/1/%E2%80%8C/g')
            sed "s|\$|${mark}|" servers.clean | base64 -w0 > "out/$token"
            echo "built out/$token  (label: $label, ${#mark} bytes of marker)"
          done

      - name: Publish per-user subscriptions to secret Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -euo pipefail
          # Everything goes through files, never through shell variables or
          # command-line arguments: a single argv entry is capped at 128 KB and
          # the payload outgrew that at ~20 servers x 19 subscriptions (exit 126).
          for f in out/*; do
            jq -n --arg n "$(basename "$f")" --rawfile c "$f" '{($n): {content: $c}}'
          done | jq -s 'add' > files.json

          # Files that exist in the gist but no longer in users.txt are revoked:
          # PATCHing them to null deletes them. gistfile1.txt is the anchor a
          # gist needs to keep existing, so it is never touched.
          curl -sS -H "Authorization: Bearer $GIST_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/gists/$GIST_ID" \
            | jq -r '.files | keys[]' | sort > gist.current
          ls out | sort > gist.wanted
          comm -23 gist.current gist.wanted | grep -vx 'gistfile1.txt' > gist.revoked || true
          while read -r r; do
            [ -n "$r" ] || continue
            echo "revoking $r" >&2
            jq -n --arg n "$r" '{($n): null}'
          done < gist.revoked | jq -s 'add // {}' > nulls.json

          jq -s '{files: (.[0] + .[1])}' files.json nulls.json > payload.json
          echo "payload: $(wc -c < payload.json) bytes, $(jq '.files | length' payload.json) files"
          code=$(curl -sS -X PATCH \
                     -H "Authorization: Bearer $GIST_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/gists/$GIST_ID" \
                     -d @payload.json -o response.json -w '%{http_code}')
          echo "gist API returned $code"
          if [ "$code" != "200" ]; then
            echo "--- response body ---"
            jq -r '.message? // ., (.errors? // empty)' response.json || cat response.json
            exit 1
          fi

      - name: Commit shared subscription
        run: |
          set -euo pipefail
          rm -f servers.clean
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add sub A-Link
          git diff --staged --quiet || git commit -m "rebuild sub"
          git push
